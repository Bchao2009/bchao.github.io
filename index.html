<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandon Chao | Digital Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --accent: #ffffff;
            --text-main: #f0f0f0;
            --text-dim: #777777;
            --transition-slow: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        html { scroll-behavior: smooth; }

        /* --- Animations --- */
        .reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: var(--transition-slow); 
        }
        
        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: var(--transition-slow);
        }

        .active { 
            opacity: 1; 
            transform: translate(0); 
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0; width: 100%; padding: 1.5rem 10%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1a1a1a;
        }

        .logo { font-weight: 900; letter-spacing: -1px; font-size: 1.1rem; }
        .nav-links a { color: var(--text-dim); text-decoration: none; margin-left: 2rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        /* --- Hero --- */
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
        .hero-tagline { color: var(--text-dim); text-transform: uppercase; letter-spacing: 5px; font-size: 0.7rem; margin-bottom: 1.5rem; }
        h1 { font-size: clamp(3rem, 10vw, 7.5rem); font-weight: 900; line-height: 0.85; margin-bottom: 2rem; letter-spacing: -4px; }
        .hero-desc { max-width: 600px; font-size: 1.2rem; color: var(--text-dim); font-weight: 300; }

        /* --- General Section Layout --- */
        section { padding: 100px 10%; border-bottom: 1px solid #111; }
        .section-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 4px; color: var(--text-dim); margin-bottom: 2rem; display: block; }

        /* --- Mission Section --- */
        .mission-text { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; line-height: 1.2; max-width: 1000px; }
        .highlight { color: var(--accent); }

        /* --- Work Grid --- */
        .work-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(45%, 1fr)); gap: 3rem; margin-top: 2rem; }
        .work-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #222; transition: 0.4s; }
        .work-card:hover { border-color: #444; transform: translateY(-5px); }
        .image-slot { width: 100%; aspect-ratio: 16/10; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #333; font-weight: 700; }
        .work-info { padding: 2rem; }
        .work-info
